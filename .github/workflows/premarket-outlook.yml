name: 09:00 IST pre-market outlook

on:
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC, Monday to Friday.
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: india-stock-radar-premarket
  cancel-in-progress: false

jobs:
  send-pre-market-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RADAR_COMMAND: premarket
      RADAR_STOCK_LIMIT: "250"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out scanner source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: new
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - name: Install lightweight market-data dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-bot.txt
      - name: Send pre-market outlook to Telegram
        run: python telegram_action.py
