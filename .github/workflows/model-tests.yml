name: Recommendation model tests

on:
  push:
    branches: [recommendation-v2]
  pull_request:
    branches: [new, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run scoring tests
        run: python -m unittest discover -s tests -v
