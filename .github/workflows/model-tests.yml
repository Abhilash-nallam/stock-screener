name: Recommendation and Telegram tests

on:
  push:
    branches: [new, recommendation-v2]
  pull_request:
    branches: [new, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Telegram action entry point
        run: python -m py_compile telegram_action.py telegram_bot.py
