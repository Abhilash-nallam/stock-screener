name: Telegram stock radar commands

on:
  workflow_dispatch:
    inputs:
      command:
        description: Telegram action
        required: true
        type: choice
        options:
          - scan
          - refresh_nse
          - refresh_bse
          - refresh_all
          - status
      stock_limit:
        description: Number of stocks for scan
        required: true
        type: choice
        options:
          - "250"
          - "500"
        default: "250"

permissions:
  contents: read

concurrency:
  group: india-stock-radar-telegram-scan
  cancel-in-progress: false

jobs:
  execute-telegram-command:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RADAR_COMMAND: ${{ inputs.command }}
      RADAR_STOCK_LIMIT: ${{ inputs.stock_limit }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out scanner source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: new

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      - name: Restore exchange-universe cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/nse_equity_universe.csv
            data/bse_equity_universe.csv
            data/universe_refresh.json
          key: radar-universe-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            radar-universe-${{ runner.os }}-

      - name: Install lightweight scanner dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-bot.txt

      - name: Execute Telegram request
        run: python telegram_action.py
