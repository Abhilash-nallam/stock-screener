services:
  - type: worker
    name: india-stock-radar-telegram
    runtime: python
    branch: new
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -u telegram_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
